schema_version: 1
# Operator-controlled gates, never writable by Astra.
autonomous_execution_enabled: false
os_isolation_verified: false
arm_hardware_test_passed: false
gripper_hardware_test_passed: false
request_file: controller/command.json
data_directory: data/agent_bridge
max_request_bytes: 4096
observation_ttl_s: 10.0
minimum_command_interval_s: 1.0
max_commands_per_session: null
max_gripper_fraction_step: 0.10
# No cumulative session-motion caps. Per-command and workspace guards remain.
max_translation_from_session_start_m: null
max_rotation_from_session_start_deg: null
# franka-toy-style velocity policy: no custom angular excursion cap.
# Existing Cartesian bounds and slow commanded dynamics still apply.
max_joint_excursion_from_session_start_rad: null
